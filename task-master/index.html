<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Master - Daily Productivity Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --bg-dark: #1f2937;
            --bg-card: #374151;
            --text-light: #f9fafb;
            --text-gray: #9ca3af;
            --border-color: #4b5563;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #111827 100%);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary-color), var(--success-color));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }

        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-color), var(--success-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-success {
            background: var(--success-color);
            color: white;
        }

        .btn-warning {
            background: var(--warning-color);
            color: white;
        }

        .btn-danger {
            background: var(--danger-color);
            color: white;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-icon {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            color: var(--text-gray);
            font-size: 14px;
        }

        /* Main Content Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Task Section */
        .section-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
        }

        /* Calendar */
        .calendar-container {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid var(--border-color);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-nav {
            display: flex;
            gap: 10px;
        }

        .calendar-nav button {
            width: 35px;
            height: 35px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-light);
            cursor: pointer;
            font-size: 18px;
        }

        .calendar-nav button:hover {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .calendar-day-header {
            text-align: center;
            padding: 10px;
            font-weight: 600;
            color: var(--text-gray);
            font-size: 14px;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            min-height: 80px;
        }

        .calendar-day:hover {
            background: var(--border-color);
        }

        .calendar-day.today {
            background: var(--primary-color);
            border: 2px solid var(--success-color);
        }

        .calendar-day.has-tasks::after {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--success-color);
            border-radius: 50%;
            position: absolute;
            bottom: 8px;
        }

        .calendar-day.other-month {
            opacity: 0.3;
        }

        .day-number {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .day-task-count {
            font-size: 11px;
            color: var(--text-gray);
        }

        /* Task List */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .task-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid var(--primary-color);
            transition: all 0.3s ease;
        }

        .task-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }

        .task-item.completed {
            border-left-color: var(--success-color);
            opacity: 0.7;
        }

        .task-item.overdue {
            border-left-color: var(--danger-color);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .task-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .task-description {
            color: var(--text-gray);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .task-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .task-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-category {
            background: rgba(79, 70, 229, 0.2);
            color: var(--primary-color);
        }

        .badge-priority-high {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger-color);
        }

        .badge-priority-medium {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning-color);
        }

        .badge-priority-low {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success-color);
        }

        .task-actions {
            display: flex;
            gap: 10px;
        }

        .task-actions button {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 28px;
            cursor: pointer;
            padding: 0;
            width: 35px;
            height: 35px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-gray);
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-light);
            font-size: 14px;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Progress Section */
        .progress-section {
            margin-top: 30px;
        }

        .progress-bar-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--success-color));
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .progress-text {
            text-align: center;
            color: var(--text-gray);
            font-size: 14px;
        }

        /* Motivational Quote */
        .motivation-banner {
            background: linear-gradient(135deg, var(--primary-color), var(--success-color));
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 30px;
        }

        .motivation-text {
            font-size: 18px;
            font-weight: 600;
            font-style: italic;
        }

        .motivation-author {
            margin-top: 10px;
            font-size: 14px;
            opacity: 0.9;
        }

        /* Notifications Panel */
        .notifications-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 350px;
            max-height: 400px;
            overflow-y: auto;
            z-index: 1001;
        }

        .notification-item {
            background: var(--bg-card);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid var(--primary-color);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .notification-title {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .notification-body {
            font-size: 13px;
            color: var(--text-gray);
        }

        /* Filter Tabs */
        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-light);
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .filter-tab.active,
        .filter-tab:hover {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-gray);
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .empty-state-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-light);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon">TM</div>
                <h1>Task Master</h1>
            </div>
            <div class="header-actions">
                <button class="btn btn-warning" onclick="checkNotifications()">
                    🔔 Check Alerts
                </button>
                <button class="btn btn-primary" onclick="openAddTaskModal()">
                    ➕ Add Task
                </button>
            </div>
        </header>

        <!-- Motivational Banner -->
        <div class="motivation-banner">
            <div class="motivation-text" id="dailyQuote">
                "Don't let competitors win! Every task completed brings you closer to success!"
            </div>
            <div class="motivation-author">- Your Success Journey</div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📋</div>
                <div class="stat-value" id="totalTasks">0</div>
                <div class="stat-label">Total Tasks</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-value" id="completedTasks">0</div>
                <div class="stat-label">Completed Today</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⏰</div>
                <div class="stat-value" id="pendingTasks">0</div>
                <div class="stat-label">Pending Tasks</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🔥</div>
                <div class="stat-value" id="overdueTasks">0</div>
                <div class="stat-label">Overdue Tasks</div>
            </div>
        </div>

        <!-- Main Grid -->
        <div class="main-grid">
            <!-- Left Column - Task List -->
            <div>
                <!-- Filter Tabs -->
                <div class="filter-tabs">
                    <button class="filter-tab active" onclick="filterTasks('all')">All Tasks</button>
                    <button class="filter-tab" onclick="filterTasks('today')">Today</button>
                    <button class="filter-tab" onclick="filterTasks('pending')">Pending</button>
                    <button class="filter-tab" onclick="filterTasks('completed')">Completed</button>
                    <button class="filter-tab" onclick="filterTasks('overdue')">Overdue</button>
                </div>

                <!-- Task List Section -->
                <div class="section-card">
                    <div class="section-header">
                        <h2 class="section-title">Your Tasks</h2>
                    </div>
                    <div class="task-list" id="taskList">
                        <!-- Tasks will be loaded here -->
                    </div>
                </div>

                <!-- Progress Section -->
                <div class="progress-section section-card">
                    <div class="section-header">
                        <h2 class="section-title">Weekly Progress</h2>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="progressBar" style="width: 0%"></div>
                    </div>
                    <div class="progress-text" id="progressText">0% Complete</div>
                </div>
            </div>

            <!-- Right Column - Calendar -->
            <div class="calendar-container">
                <div class="calendar-header">
                    <h2 class="section-title" id="currentMonthYear">Calendar</h2>
                    <div class="calendar-nav">
                        <button onclick="previousMonth()">◀</button>
                        <button onclick="goToToday()">Today</button>
                        <button onclick="nextMonth()">▶</button>
                    </div>
                </div>
                <div class="calendar-grid" id="calendarGrid">
                    <!-- Calendar will be generated here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Task Modal -->
    <div class="modal-overlay" id="taskModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Add New Task</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="taskForm" onsubmit="saveTask(event)">
                <input type="hidden" id="taskId">
                
                <div class="form-group">
                    <label class="form-label">Task Title *</label>
                    <input type="text" class="form-input" id="taskTitle" required placeholder="e.g., Email Marketing Day">
                </div>

                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea class="form-textarea" id="taskDescription" placeholder="Describe what needs to be done..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Category</label>
                        <select class="form-select" id="taskCategory">
                            <option value="marketing">Marketing</option>
                            <option value="content">Content Creation</option>
                            <option value="client-work">Client Work</option>
                            <option value="video">Video Production</option>
                            <option value="outreach">Outreach</option>
                            <option value="management">Management</option>
                            <option value="writing">Writing</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Priority</label>
                        <select class="form-select" id="taskPriority">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Scheduled Date</label>
                        <input type="date" class="form-input" id="taskDate">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Duration (hours)</label>
                        <input type="number" class="form-input" id="taskDuration" min="1" max="24" value="4">
                    </div>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 25px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">
                        💾 Save Task
                    </button>
                    <button type="button" class="btn btn-danger" onclick="closeModal()">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notifications Panel -->
    <div class="notifications-panel" id="notificationsPanel"></div>

    <script>
        const { ipcRenderer } = require('electron');
        
        let allTasks = [];
        let currentFilter = 'all';
        let currentDate = new Date();
        let editingTaskId = null;

        // Initialize app
        document.addEventListener('DOMContentLoaded', () => {
            loadTasks();
            renderCalendar();
            updateStats();
            showDailyMotivation();
            
            // Set default date to today
            document.getElementById('taskDate').valueAsDate = new Date();
        });

        // Load tasks from backend
        async function loadTasks() {
            allTasks = await ipcRenderer.invoke('load-tasks');
            renderTaskList();
            updateStats();
            renderCalendar();
        }

        // Render task list
        function renderTaskList() {
            const taskList = document.getElementById('taskList');
            const today = new Date().toISOString().split('T')[0];
            
            let filteredTasks = allTasks.tasks || [];
            
            if (currentFilter === 'today') {
                filteredTasks = filteredTasks.filter(t => t.scheduled === today);
            } else if (currentFilter === 'pending') {
                filteredTasks = filteredTasks.filter(t => t.status === 'pending');
            } else if (currentFilter === 'completed') {
                filteredTasks = filteredTasks.filter(t => t.status === 'completed');
            } else if (currentFilter === 'overdue') {
                filteredTasks = filteredTasks.filter(t => t.scheduled && t.scheduled < today && t.status === 'pending');
            }

            if (filteredTasks.length === 0) {
                taskList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🎯</div>
                        <div class="empty-state-title">No tasks found</div>
                        <p>Add a new task to get started!</p>
                    </div>
                `;
                return;
            }

            taskList.innerHTML = filteredTasks.map(task => {
                const isOverdue = task.scheduled && task.scheduled < today && task.status === 'pending';
                const taskClass = `task-item ${task.status === 'completed' ? 'completed' : ''} ${isOverdue ? 'overdue' : ''}`;
                
                return `
                    <div class="${taskClass}">
                        <div class="task-header">
                            <div class="task-title">${task.title}</div>
                        </div>
                        <div class="task-description">${task.description || 'No description'}</div>
                        <div class="task-meta">
                            <span class="task-badge badge-category">${task.category}</span>
                            <span class="task-badge badge-priority-${task.priority}">${task.priority}</span>
                            ${task.scheduled ? `<span class="task-badge" style="background: rgba(255,255,255,0.1);">📅 ${formatDate(task.scheduled)}</span>` : ''}
                            ${task.duration ? `<span class="task-badge" style="background: rgba(255,255,255,0.1);">⏱️ ${task.duration}h</span>` : ''}
                        </div>
                        <div class="task-actions">
                            ${task.status !== 'completed' ? `
                                <button class="btn-success" onclick="completeTask(${task.id})">✓ Complete</button>
                            ` : ''}
                            <button class="btn-primary" onclick="editTask(${task.id})">✏️ Edit</button>
                            <button class="btn-danger" onclick="deleteTask(${task.id})">🗑️ Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Render calendar
        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            document.getElementById('currentMonthYear').textContent = 
                new Date(year, month).toLocaleString('default', { month: 'long', year: 'numeric' });
            
            // Clear grid
            grid.innerHTML = '';
            
            // Day headers
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            days.forEach(day => {
                grid.innerHTML += `<div class="calendar-day-header">${day}</div>`;
            });
            
            // Get first day of month and total days
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();
            
            const today = new Date().toISOString().split('T')[0];
            
            // Previous month days
            for (let i = firstDay - 1; i >= 0; i--) {
                const day = daysInPrevMonth - i;
                grid.innerHTML += `
                    <div class="calendar-day other-month">
                        <div class="day-number">${day}</div>
                    </div>
                `;
            }
            
            // Current month days
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isToday = dateStr === today;
                const taskCount = (allTasks.tasks || []).filter(t => t.scheduled === dateStr).length;
                const hasTasks = taskCount > 0;
                
                grid.innerHTML += `
                    <div class="calendar-day ${isToday ? 'today' : ''} ${hasTasks ? 'has-tasks' : ''}" 
                         onclick="showDayTasks('${dateStr}')">
                        <div class="day-number">${day}</div>
                        ${hasTasks ? `<div class="day-task-count">${taskCount} tasks</div>` : ''}
                    </div>
                `;
            }
            
            // Next month days
            const totalCells = firstDay + daysInMonth;
            const remainingCells = 42 - totalCells; // 6 rows * 7 days
            for (let day = 1; day <= remainingCells; day++) {
                grid.innerHTML += `
                    <div class="calendar-day other-month">
                        <div class="day-number">${day}</div>
                    </div>
                `;
            }
        }

        // Update statistics
        function updateStats() {
            const tasks = allTasks.tasks || [];
            const today = new Date().toISOString().split('T')[0];
            
            const total = tasks.length;
            const completed = tasks.filter(t => t.status === 'completed').length;
            const pending = tasks.filter(t => t.status === 'pending').length;
            const overdue = tasks.filter(t => t.scheduled && t.scheduled < today && t.status === 'pending').length;
            
            document.getElementById('totalTasks').textContent = total;
            document.getElementById('completedTasks').textContent = completed;
            document.getElementById('pendingTasks').textContent = pending;
            document.getElementById('overdueTasks').textContent = overdue;
            
            // Update progress bar
            const progress = total > 0 ? Math.round((completed / total) * 100) : 0;
            document.getElementById('progressBar').style.width = `${progress}%`;
            document.getElementById('progressText').textContent = `${progress}% Complete`;
        }

        // Show daily motivation
        function showDailyMotivation() {
            const quotes = [
                "Don't let competitors win! Every task completed brings you closer to success!",
                "Success doesn't come from what you do occasionally, it comes from what you do consistently!",
                "Your future is created by what you do today, not tomorrow!",
                "The difference between successful people and others is not lack of strength, but lack of will!",
                "Every expert was once a beginner. Every pro was once an amateur. Keep going!",
                "You don't have to be great to start, but you have to start to be great!",
                "The only impossible journey is the one you never begin!"
            ];
            
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            document.getElementById('dailyQuote').textContent = `"${randomQuote}"`;
        }

        // Filter tasks
        function filterTasks(filter) {
            currentFilter = filter;
            
            // Update active tab
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderTaskList();
        }

        // Open modal for adding task
        function openAddTaskModal() {
            editingTaskId = null;
            document.getElementById('modalTitle').textContent = 'Add New Task';
            document.getElementById('taskForm').reset();
            document.getElementById('taskId').value = '';
            document.getElementById('taskDate').valueAsDate = new Date();
            document.getElementById('taskModal').classList.add('active');
        }

        // Close modal
        function closeModal() {
            document.getElementById('taskModal').classList.remove('active');
            editingTaskId = null;
        }

        // Edit task
        async function editTask(taskId) {
            const task = allTasks.tasks.find(t => t.id === taskId);
            if (!task) return;
            
            editingTaskId = taskId;
            document.getElementById('modalTitle').textContent = 'Edit Task';
            document.getElementById('taskId').value = task.id;
            document.getElementById('taskTitle').value = task.title;
            document.getElementById('taskDescription').value = task.description || '';
            document.getElementById('taskCategory').value = task.category;
            document.getElementById('taskPriority').value = task.priority;
            document.getElementById('taskDate').value = task.scheduled || '';
            document.getElementById('taskDuration').value = task.duration || 4;
            
            document.getElementById('taskModal').classList.add('active');
        }

        // Save task
        async function saveTask(event) {
            event.preventDefault();
            
            const taskData = {
                title: document.getElementById('taskTitle').value,
                description: document.getElementById('taskDescription').value,
                category: document.getElementById('taskCategory').value,
                priority: document.getElementById('taskPriority').value,
                scheduled: document.getElementById('taskDate').value,
                duration: parseInt(document.getElementById('taskDuration').value)
            };
            
            if (editingTaskId) {
                await ipcRenderer.invoke('update-task', editingTaskId, taskData);
                showNotification('Task Updated', 'Your task has been updated successfully!');
            } else {
                await ipcRenderer.invoke('add-task', taskData);
                showNotification('Task Created', 'New task has been added to your schedule!');
            }
            
            closeModal();
            loadTasks();
        }

        // Complete task
        async function completeTask(taskId) {
            await ipcRenderer.invoke('complete-task', taskId);
            showNotification('Task Completed', 'Great job! Another step towards success! 🎉');
            loadTasks();
        }

        // Delete task
        async function deleteTask(taskId) {
            if (confirm('Are you sure you want to delete this task?')) {
                await ipcRenderer.invoke('delete-task', taskId);
                showNotification('Task Deleted', 'Task has been removed.');
                loadTasks();
            }
        }

        // Check notifications
        async function checkNotifications() {
            await ipcRenderer.invoke('check-notifications');
            showNotification('Notifications Checked', 'We\'ve checked for any urgent alerts!');
        }

        // Show notification in UI
        function showNotification(title, body) {
            const panel = document.getElementById('notificationsPanel');
            const notification = document.createElement('div');
            notification.className = 'notification-item';
            notification.innerHTML = `
                <div class="notification-title">${title}</div>
                <div class="notification-body">${body}</div>
            `;
            
            panel.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 5000);
        }

        // Calendar navigation
        function previousMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        }

        function goToToday() {
            currentDate = new Date();
            renderCalendar();
        }

        function showDayTasks(dateStr) {
            currentFilter = 'all';
            document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.remove('active'));
            
            const dayTasks = (allTasks.tasks || []).filter(t => t.scheduled === dateStr);
            if (dayTasks.length > 0) {
                showNotification(`Tasks for ${formatDate(dateStr)}`, 
                    `${dayTasks.length} task(s) scheduled on this day`);
            } else {
                showNotification(`No tasks for ${formatDate(dateStr)}`, 
                    'This day is clear. Great time to schedule something!');
            }
        }

        // Format date
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { 
                weekday: 'short', 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric' 
            });
        }

        // Close modal on outside click
        document.getElementById('taskModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('taskModal')) {
                closeModal();
            }
        });
    </script>
</body>
</html>
